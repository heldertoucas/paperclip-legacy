default_permissions = "rulesync"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[mcp_servers.dev-universe]
command = "C:/Users/helder.toucas/Dev/engine/.venv/Scripts/python.exe"
args = [ "-u", "-m", "dev.mcp.dispatcher" ]

[mcp_servers.dev-universe.env]
DEV_ROOT = "C:/Users/helder.toucas/Dev"
PYTHONPATH = "C:/Users/helder.toucas/Dev/engine"
PYTHONUNBUFFERED = "1"
PYTHONIOENCODING = "utf-8"

[mcp_servers.fetch]
command = "C:/Users/helder.toucas/scoop/persist/uv/tools/versions/mcp-server-fetch/Scripts/python.exe"
args = [ "-m", "mcp_server_fetch" ]

[mcp_servers.graphify]
command = "C:/Users/helder.toucas/Dev/graphify/.venv/Scripts/python.exe"
args = [ "-u", "-m", "graphify.serve" ]

[mcp_servers.graphify.env]
PYTHONPATH = "C:/Users/helder.toucas/Dev/graphify"
PYTHONUNBUFFERED = "1"
PYTHONIOENCODING = "utf-8"

[mcp_servers.context7]
command = "cmd.exe"
args = [ "/c", "context7-mcp.cmd" ]

[mcp_servers.playwright]
command = "cmd.exe"
args = [ "/c", "playwright-mcp.cmd", "--headless" ]

[mcp_servers.ai-obsidian]
command = "node"
args = [ "C:/Users/helder.toucas/Dev/ai-obsidian/dist/index.js" ]

[mcp_servers.ai-obsidian.env]
OBSIDIAN_VAULT_PATH = "C:/Users/helder.toucas/Dev/home"
GEMINI_OBSIDIAN_DB_PATH = "C:/Users/helder.toucas/Dev/.dev-cache/ai-obsidian-lancedb"
GEMINI_OBSIDIAN_HASH_PATH = "C:/Users/helder.toucas/Dev/.dev-cache/ai-obsidian-file-hashes.json"

[permissions.rulesync]
extends = ":workspace"

[permissions.rulesync.filesystem]
":minimal" = "read"
glob_scan_max_depth = 8

[permissions.rulesync.filesystem.":workspace_roots"]
"**/.env*" = "deny"
"**/keys.txt" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/id_rsa*" = "deny"
"**/id_ed25519*" = "deny"
".git/**" = "write"
